# Sobe o FinScan completo (app Next.js + PostgreSQL) a partir da raiz do repositório:
#   cp .env.example .env   # opcional; sem ele valem os padrões abaixo
#   docker compose up --build -d
# Variáveis lidas do .env da raiz (veja .env.example): GEMINI_API_KEY, POSTGRES_PASSWORD.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finscan}
      POSTGRES_DB: finscan
    ports:
      # Exposto em 5433 no host para rodar `pnpm dev` localmente contra o banco do container.
      - "5433:5432"
    volumes:
      - finscan-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finscan -d finscan"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://finscan:${POSTGRES_PASSWORD:-finscan}@db:5432/finscan
      # Opcional: sem a chave o app funciona, só a categorização por IA (/categorizar) fica indisponível.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  finscan-db:
